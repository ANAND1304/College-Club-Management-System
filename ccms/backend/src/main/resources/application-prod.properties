# =============================================
# Production profile — values come from env vars
# Run with: java -jar app.jar --spring.profiles.active=prod
# =============================================
# Server - port 8080 required for Render
server.port=8080
 
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/club_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:7870}
 
# JPA - create drops and recreates all tables cleanly
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

 # Keep session open to prevent lazy loading errors
spring.jpa.open-in-view=true
# Remove dialect - let Hibernate auto-detect (fixes MySQLDialect warning)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
 
# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
 
# CORS
app.cors.allowed-origins=${CORS_ORIGINS:*}
app.admin-secret=${ADMIN_SECRET:CLUBHUB_ADMIN_2024}
 
# Error handling
server.error.include-stacktrace=never
server.error.include-message=always
 
# Logging
logging.level.root=WARN
logging.level.com.clubmanagement=INFO
