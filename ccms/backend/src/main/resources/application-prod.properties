# =============================================
# Production profile — values come from env vars
# Run with: java -jar app.jar --spring.profiles.active=prod
# =============================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/club_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:7870}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ORIGINS}

# Disable stack traces in error responses
server.error.include-stacktrace=never
server.error.include-message=always

logging.level.root=WARN
logging.level.com.clubmanagement=INFO
